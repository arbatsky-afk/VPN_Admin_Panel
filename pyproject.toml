[project]
name = "vpn-admin-panel"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

[tool.coverage.run]
branch = true
dynamic_context = "test_function"
relative_files = true
source_dirs = ["app", "monitor", "common", "tools", "supply_chain", "scripts"]

[tool.coverage.report]
include_namespace_packages = true
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 99
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
preview = true

[tool.ruff.lint.per-file-ignores]
"app/services/remote_sources/*.py" = ["F821"]

[tool.ruff.lint.pep8-naming]
ignore-names = [
    "closeEvent",
    "dragEnterEvent",
    "dragMoveEvent",
    "dropEvent",
    "enterEvent",
    "eventFilter",
    "keyPressEvent",
    "leaveEvent",
    "minimumSizeHint",
    "nextCheckState",
    "paintEvent",
    "requestInterruption",
    "resizeEvent",
    "showEvent",
    "sizeHint",
]
